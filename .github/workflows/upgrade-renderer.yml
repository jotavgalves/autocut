name: Finalize AUTOCUT renderer
on:
  pull_request:
    branches: [main]
    types: [reopened]
permissions:
  contents: write
jobs:
  finalize-renderer:
    if: github.head_ref == 'fix/autocut-production-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autocut-production-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact syntax fix
        run: node scripts/upgrade-renderer.mjs
      - name: Verify renderer syntax
        run: node --check src/renderer/app.js
      - name: Remove temporary finalizer and commit
        run: |
          rm scripts/upgrade-renderer.mjs .github/workflows/upgrade-renderer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize AUTOCUT renderer"
          git push origin HEAD:fix/autocut-production-core
