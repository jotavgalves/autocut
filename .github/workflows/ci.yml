name: AUTOCUT CI

on:
  push:
    branches:
      - main
      - fix/autocut-production-core
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check main syntax
        run: node --check src/main/index.js
      - name: Check renderer syntax
        run: node --check src/renderer/app.js
      - name: Run unit tests
        run: npm test
      - name: Build renderer
        run: npm run build
