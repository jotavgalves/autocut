name: AUTOCUT CI
on:
  push:
    branches: [main, fix/autocut-production-core]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: find src/main src/shared src/renderer -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run unit and adapter tests
        run: npm test
      - name: Build renderer
        run: npm run build
